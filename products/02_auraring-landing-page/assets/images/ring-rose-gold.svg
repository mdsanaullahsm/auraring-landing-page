<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="floorShadowRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D1515" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm 18K Horizon Rose Gold Gradient -->
    <linearGradient id="roseFinish" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#DDA18A"/>
      <stop offset="14%" stop-color="#FFF0EB"/>
      <stop offset="28%" stop-color="#B8735C"/>
      <stop offset="42%" stop-color="#FCD5C8"/>
      <stop offset="60%" stop-color="#8F4B38"/>
      <stop offset="78%" stop-color="#E5AA96"/>
      <stop offset="90%" stop-color="#FFF5F2"/>
      <stop offset="100%" stop-color="#B8735C"/>
    </linearGradient>

    <linearGradient id="roseChamfer" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8735C"/>
      <stop offset="20%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E5AA96"/>
      <stop offset="80%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#8F4B38"/>
    </linearGradient>

    <linearGradient id="innerResinRose" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1A1211"/>
      <stop offset="50%" stop-color="#261715"/>
      <stop offset="100%" stop-color="#140D0C"/>
    </linearGradient>

    <radialGradient id="sensorDome" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#059669" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.9"/>
    </radialGradient>

    <radialGradient id="irSensorDome" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#DC2626" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#450A0A" stop-opacity="0.9"/>
    </radialGradient>

    <linearGradient id="goldPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <filter id="naturalShadowRose" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="35" stdDeviation="35" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="620" rx="280" ry="60" fill="url(#floorShadowRose)"/>
  <ellipse cx="400" cy="600" rx="190" ry="25" fill="#000000" opacity="0.3"/>

  <g filter="url(#naturalShadowRose)">
    <ellipse cx="400" cy="380" rx="260" ry="260" fill="url(#roseFinish)"/>
    <ellipse cx="400" cy="380" rx="258" ry="258" fill="none" stroke="url(#roseChamfer)" stroke-width="3" opacity="0.95"/>
    <ellipse cx="400" cy="380" rx="198" ry="198" fill="url(#innerResinRose)"/>
    <ellipse cx="400" cy="380" rx="198" ry="198" fill="none" stroke="#000000" stroke-width="8" opacity="0.5"/>
    <ellipse cx="400" cy="383" rx="196" ry="196" fill="none" stroke="#FFEAE2" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Laser-Etched Hallmark -->
  <g opacity="0.5">
    <path id="engravePathRose" d="M 230 360 A 198 198 0 0 1 570 360" fill="none"/>
    <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#E5AA96" letter-spacing="4">
      <textPath href="#engravePathRose" startOffset="50%" text-anchor="middle">
        AURARING • 18K HORIZON ROSE • 50M WATERPROOF • SN-9044
      </textPath>
    </text>
  </g>

  <!-- Sensors -->
  <g>
    <g transform="translate(300, 480)">
      <circle cx="0" cy="0" r="20" fill="#140D0C" stroke="#8F4B38" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="15" fill="url(#sensorDome)"/>
      <ellipse cx="-4" cy="-5" rx="5" ry="3" fill="#FFFFFF" opacity="0.8" transform="rotate(-30)"/>
    </g>

    <g transform="translate(400, 525)">
      <circle cx="0" cy="0" r="22" fill="#140D0C" stroke="#8F4B38" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="17" fill="url(#irSensorDome)"/>
      <ellipse cx="-5" cy="-5" rx="6" ry="3.5" fill="#FFFFFF" opacity="0.8" transform="rotate(-30)"/>
    </g>

    <g transform="translate(500, 480)">
      <circle cx="0" cy="0" r="19" fill="#140D0C" stroke="#8F4B38" stroke-width="1.5"/>
      <rect x="-6" y="-6" width="12" height="12" rx="3" fill="url(#goldPin)"/>
      <ellipse cx="-3" cy="-4" rx="4" ry="2" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </g>

  <path d="M 220 240 A 260 260 0 0 1 580 240" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M 290 160 A 260 260 0 0 1 510 160" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
</svg>
