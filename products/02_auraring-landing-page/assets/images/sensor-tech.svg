<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="techBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="sensorBurst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="320" rx="20" fill="url(#techBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Sensor Array Wireframe Anatomy -->
  <g transform="translate(130, 60)">
    <!-- Main PCB Base -->
    <rect x="0" y="20" width="240" height="150" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
    
    <!-- Micro Circuit Traces -->
    <path d="M 30,20 L 30,60 L 70,60" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 210,20 L 210,60 L 170,60" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 50,170 L 50,130 L 90,130" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3"/>
    
    <!-- Optical Lens Center -->
    <circle cx="120" cy="95" r="45" fill="#090D16" stroke="#475569" stroke-width="2"/>
    <circle cx="120" cy="95" r="40" fill="url(#sensorBurst)"/>
    
    <!-- PPG Multi-Wavelength LEDs -->
    <circle cx="100" cy="85" r="8" fill="#10B981" stroke="#34D399" stroke-width="2"/>
    <circle cx="140" cy="85" r="8" fill="#EF4444" stroke="#F87171" stroke-width="2"/>
    <circle cx="120" cy="115" r="9" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
    
    <!-- Golden Contact Pins -->
    <circle cx="50" cy="95" r="6" fill="#F59E0B"/>
    <circle cx="190" cy="95" r="6" fill="#F59E0B"/>

    <!-- Pulse Waves Radiating -->
    <circle cx="120" cy="95" r="60" fill="none" stroke="#10B981" stroke-width="1" opacity="0.4"/>
    <circle cx="120" cy="95" r="75" fill="none" stroke="#10B981" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Labels -->
  <text x="40" y="270" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Triple-Frequency PPG Array</text>
  <text x="40" y="292" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Green, Red &amp; Infrared photodetectors sampling at 250Hz</text>
</svg>
