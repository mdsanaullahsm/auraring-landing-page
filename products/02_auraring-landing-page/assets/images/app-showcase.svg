<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 840" width="420" height="840">
  <defs>
    <!-- iPhone Titanium Frame Gradient -->
    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4744"/>
      <stop offset="30%" stop-color="#2D2B29"/>
      <stop offset="70%" stop-color="#1A1918"/>
      <stop offset="100%" stop-color="#3A3835"/>
    </linearGradient>

    <!-- App Background Deep Velvet Dark -->
    <linearGradient id="appScreenBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#171615"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>

    <!-- Score Glow Ring Gradient -->
    <linearGradient id="scoreRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Shadow for iPhone -->
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Phone Shell with Soft Drop Shadow -->
  <g filter="url(#phoneShadow)">
    <!-- Titanium Outer Bezel -->
    <rect x="10" y="10" width="400" height="820" rx="54" fill="url(#phoneFrame)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    
    <!-- Screen Glass Canvas -->
    <rect x="18" y="18" width="384" height="804" rx="46" fill="url(#appScreenBg)"/>
  </g>

  <!-- Dynamic Island Top Notch -->
  <rect x="150" y="32" width="120" height="30" rx="15" fill="#000000"/>
  <circle cx="245" cy="47" r="4.5" fill="#1A1918"/>

  <!-- Screen Content / Aura Companion App UI -->
  <g transform="translate(36, 80)">
    <!-- Top Header: Date & Battery status -->
    <text x="0" y="16" fill="#A8A29E" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="1">TODAY • TUESDAY</text>
    <text x="0" y="44" fill="#F8F6F2" font-family="'Cormorant Garamond', Georgia, serif" font-size="32" font-weight="600">Daily Readiness</text>

    <!-- Battery Indicator Right -->
    <g transform="translate(310, 8)">
      <rect x="0" y="0" width="34" height="16" rx="4" fill="none" stroke="#A8A29E" stroke-width="1.5"/>
      <rect x="2" y="2" width="26" height="12" rx="2" fill="#10B981"/>
      <rect x="35" y="5" width="2" height="6" rx="1" fill="#A8A29E"/>
      <text x="-48" y="13" fill="#A8A29E" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">89%</text>
    </g>

    <!-- Readiness Big Circular Score Dial -->
    <g transform="translate(174, 150)">
      <!-- Background Track -->
      <circle cx="0" cy="0" r="76" fill="none" stroke="#22201E" stroke-width="10"/>
      <!-- Active Arc -->
      <circle cx="0" cy="0" r="76" fill="none" stroke="url(#scoreRing)" stroke-width="10" stroke-dasharray="477" stroke-dashoffset="65" stroke-linecap="round" transform="rotate(-90)"/>
      
      <!-- Big Score Number -->
      <text x="0" y="12" fill="#F8F6F2" font-family="'Cormorant Garamond', serif" font-size="52" font-weight="700" text-anchor="middle">94</text>
      <text x="0" y="32" fill="#C5A880" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">OPTIMAL</text>
    </g>

    <!-- Metric Pills Below Dial -->
    <g transform="translate(0, 260)">
      <!-- Card 1: Sleep Duration -->
      <rect x="0" y="0" width="166" height="86" rx="16" fill="#1C1A18" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="16" y="24" fill="#A8A29E" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">RESTORATIVE SLEEP</text>
      <text x="16" y="52" fill="#F8F6F2" font-family="'Cormorant Garamond', serif" font-size="24" font-weight="700">8h 12m</text>
      <text x="16" y="70" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">+42m vs avg</text>

      <!-- Card 2: Resting Heart Rate / HRV -->
      <rect x="182" y="0" width="166" height="86" rx="16" fill="#1C1A18" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="198" y="24" fill="#A8A29E" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">RECOVERY HRV</text>
      <text x="198" y="52" fill="#F8F6F2" font-family="'Cormorant Garamond', serif" font-size="24" font-weight="700">72 ms</text>
      <text x="198" y="70" fill="#C5A880" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">High resilience</text>
    </g>

    <!-- Sleep Architecture Visual Waveform Card -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="348" height="160" rx="18" fill="#1C1A18" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="18" y="26" fill="#F8F6F2" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Sleep Architecture</text>
      <text x="330" y="26" fill="#A8A29E" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="end">Efficiency 96%</text>

      <!-- Hypnogram Stages Curve -->
      <path d="M 20,90 Q 60,60 100,120 T 170,80 T 230,130 T 290,70 T 330,100" fill="none" stroke="#C5A880" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 20,90 Q 60,60 100,120 T 170,80 T 230,130 T 290,70 T 330,100 L 330,135 L 20,135 Z" fill="rgba(197, 168, 128, 0.08)"/>

      <!-- Stage Legend -->
      <g transform="translate(18, 138)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">
        <circle cx="4" cy="-4" r="3" fill="#818CF8"/>
        <text x="12" y="0" fill="#A8A29E">Deep (1h 50m)</text>

        <circle cx="114" cy="-4" r="3" fill="#38BDF8"/>
        <text x="122" y="0" fill="#A8A29E">REM (2h 14m)</text>

        <circle cx="224" cy="-4" r="3" fill="#10B981"/>
        <text x="232" y="0" fill="#A8A29E">Light (4h 08m)</text>
      </g>
    </g>

    <!-- Bottom Apple Health / Google Health Connect Sync Pill -->
    <g transform="translate(0, 545)">
      <rect x="0" y="0" width="348" height="52" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="26" cy="26" r="10" fill="#E11D48"/>
      <text x="46" y="25" fill="#F8F6F2" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Apple Health &amp; Google Health Connect</text>
      <text x="46" y="38" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Continuous 2-Way Sync Active</text>
      <circle cx="325" cy="26" r="6" fill="#10B981" opacity="0.3"/>
      <circle cx="325" cy="26" r="3" fill="#10B981"/>
    </g>
  </g>
</svg>
