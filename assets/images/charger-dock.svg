<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="dockBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="chargeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#059669" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="320" rx="20" fill="url(#dockBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Dock Perspective -->
  <g transform="translate(150, 40)">
    <!-- Base Glow -->
    <ellipse cx="100" cy="150" rx="120" ry="40" fill="url(#chargeGlow)"/>

    <!-- Puck Base -->
    <ellipse cx="100" cy="140" rx="90" ry="30" fill="#090D16" stroke="#334155" stroke-width="2"/>
    <ellipse cx="100" cy="135" rx="86" ry="28" fill="#1E293B"/>

    <!-- Magnetic Center Column -->
    <path d="M 65,130 C 65,80 135,80 135,130 Z" fill="#111827" stroke="#475569" stroke-width="2"/>
    <ellipse cx="100" cy="85" rx="35" ry="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>

    <!-- LED Charging Pulse Ring -->
    <ellipse cx="100" cy="135" rx="80" ry="26" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="10 5" opacity="0.8"/>

    <!-- Lightning Bolt Icon in Center -->
    <path d="M 98,75 L 93,88 L 99,88 L 97,98 L 107,84 L 101,84 Z" fill="#10B981"/>
  </g>

  <!-- Labels -->
  <text x="40" y="270" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Magnetic Qi Rapid-Charge Dock</text>
  <text x="40" y="292" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">0 to 100% in 45 minutes • Up to 7 full days of continuous power</text>
</svg>
